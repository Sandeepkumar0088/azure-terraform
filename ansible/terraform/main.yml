- name: Configure Ubuntu PostgreSQL 17 server
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
  # Install required packages
    - name: Install required utilities and nginx
      ansible.builtin.apt:
        name:
        - curl
        - git
        - wget
        - unzip
        - vim
        - nginx
        - ca-certificates
        state: present  

  # Install PostgreSQL APT repository prerequisites
    - name: Install PostgreSQL common packages
      ansible.builtin.apt:
        name: postgresql-common
        state: present
        update_cache: true

    - name: Check PostgreSQL PGDG repository setup script
      ansible.builtin.stat:
        path: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
      register: pgdg_script

    - name: Configure official PostgreSQL repository
      ansible.builtin.command:
        argv:
          - /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          - -y
      when: pgdg_script.stat.exists
    - name: Update apt cache after repository configuration
      ansible.builtin.apt:
        update_cache: true
  # Install PostgreSQL 17 and Python database dependencies

    - name: Install PostgreSQL 17 and dependencies
      ansible.builtin.apt:
        name:
        - postgresql-17
        - postgresql-client-17
        - python3-psycopg2
        state: present

    - name: Enable and start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Set permissions for SQL dump file
      ansible.builtin.file:
        path: /home/ubuntu/public-202610131535.sql
        owner: ubuntu
        group: ubuntu
        mode: "0644"
        state: file

    - name: Copy SQL dump to /tmp
      ansible.builtin.copy:
        src: /home/ubuntu/public-202610131535.sql
        dest: /tmp/public-202610131535.sql
        remote_src: true
        owner: postgres
        group: postgres
        mode: "0644"

