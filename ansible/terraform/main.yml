    - name: Create PostgreSQL database
      become: true
      ansible.builtin.shell: |
        sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'postgresiot'" | grep -q 1 ||
        sudo -u postgres psql -c "CREATE DATABASE postgresiot;"
      args:
        executable: /bin/bash
      changed_when: false

