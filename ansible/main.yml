  # name: Create restore completion marker
  # ansible.builtin.file:
  # path: "{{ restore_marker }}"
  # state: touch
  # owner: postgres
  # group: postgres
  # mode: "0600"
  # when: not restore_status.stat.exists

  # # 9. Verify PostgreSQL installation

    - name: Check PostgreSQL version
      ansible.builtin.command: psql --version
      register: psql_version
      changed_when: false

    - name: Display PostgreSQL version
      ansible.builtin.debug:
        var: psql_version.stdout

    - name: Verify database exists
      community.postgresql.postgresql_info:
        filter:
        - databases
        login_user: postgres
        become_user: postgres
        register: postgres_info

    - name: Display database verification
      ansible.builtin.debug:
        msg: "PostgreSQL database {{ db_name }} has been configured."
        when: db_name in postgres_info.databases